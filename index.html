<style>
  :root{
    --bg:#FBFBFA;
    --surface:#FFFFFF;
    --ink:#16161A;
    --muted:#63636E;
    --faint:#9A9AA5;
    --hairline:#E7E7E4;
    --hairline-strong:#D9D9D4;
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(16,16,20,.04);
    --shadow-md:0 4px 8px -3px rgba(16,16,20,.07), 0 14px 28px -10px rgba(16,16,20,.10);
    --sans:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  a{color:inherit}
  img{max-width:100%;display:block}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}

  .skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:#fff;
    padding:10px 16px;border-radius:0 0 10px 0;font-size:14px;font-weight:600;z-index:99}
  .skip:focus{left:0}

  .wrap{max-width:1320px;margin:0 auto;padding:0 22px}

  /* ── header ───────────────────────────────────────────────── */
  header{
    border-bottom:1px solid var(--hairline);
    background:rgba(251,251,250,.88);
    backdrop-filter:saturate(1.4) blur(10px);
    position:sticky;top:0;z-index:20;
  }
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:54px}
  .wordmark{font-weight:700;font-size:15.5px;letter-spacing:-.02em;text-decoration:none;
    display:inline-flex;align-items:center;gap:8px}
  .wordmark .dot{width:8px;height:8px;border-radius:2.5px;background:var(--ink)}
  .navlinks{display:flex;align-items:center;gap:20px}
  .navlinks a{font-size:13.5px;color:var(--muted);text-decoration:none;font-weight:500;transition:color .15s}
  .navlinks a:hover{color:var(--ink)}

  /* ── hero (deliberately compact) ──────────────────────────── */
  .hero{padding:34px 0 0}
  h1{
    margin:0;font-size:clamp(26px,3.4vw,38px);line-height:1.08;
    letter-spacing:-.035em;font-weight:700;
  }
  .lede{margin:10px 0 0;font-size:15px;color:var(--muted);max-width:66ch}

  .toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    margin-top:20px;padding-top:16px;border-top:1px solid var(--hairline);
  }
  .chip{
    font:inherit;font-size:12.5px;font-weight:500;
    padding:5px 12px;border-radius:999px;cursor:pointer;
    background:transparent;color:var(--muted);
    border:1px solid var(--hairline-strong);transition:all .15s;
  }
  .chip:hover{color:var(--ink);border-color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tally{
    margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint);
    white-space:nowrap;
  }

  /* ── grid ─────────────────────────────────────────────────── */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
    gap:16px;padding:18px 0 70px;align-items:stretch;
  }

  .card{
    display:flex;flex-direction:column;
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow-sm);
    transition:transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s, border-color .2s;
  }
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--hairline-strong)}
  .card.is-hidden{display:none}

  .shot{
    position:relative;aspect-ratio:16/9;
    border-bottom:1px solid var(--hairline);overflow:hidden;
    background:
      radial-gradient(120% 130% at 18% 0%, color-mix(in srgb, var(--dot) 15%, transparent) 0%, transparent 66%),
      linear-gradient(160deg,#FAFAF8,#F0F0EE);
  }
  .shot img{width:100%;height:100%;object-fit:cover;object-position:top center;position:relative}
  /* Portrait/mobile captures letterbox rather than crop to an unreadable zoom. */
  .shot.contain img{object-fit:contain;object-position:center top;padding:8px 0 0}
  .plate{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--dot);opacity:.45;
  }
  .plate svg{width:42px;height:42px}

  .body{padding:13px 15px 0;flex:1;display:flex;flex-direction:column}
  .titlerow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .mark{
    width:26px;height:26px;flex:none;border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    color:var(--dot);
    background:color-mix(in srgb, var(--dot) 11%, #fff);
    border:1px solid color-mix(in srgb, var(--dot) 22%, transparent);
  }
  .mark svg{width:15px;height:15px}
  h2{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.015em;line-height:1.2}
  .badge{
    margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--faint);
    border:1px solid var(--hairline-strong);border-radius:5px;padding:1.5px 5px;
  }
  .blurb{
    margin:0 0 10px;font-size:12.8px;line-height:1.5;color:var(--muted);flex:1;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tags{display:flex;flex-wrap:wrap;gap:4px}
  .tag{
    font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:5px;
    color:var(--muted);background:#F5F5F3;border:1px solid var(--hairline);
  }

  .links{
    display:flex;flex-wrap:wrap;gap:5px;
    padding:11px 15px 13px;margin-top:11px;border-top:1px solid var(--hairline);
  }
  .lnk{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:550;text-decoration:none;
    padding:5px 9px;border-radius:7px;
    border:1px solid var(--hairline-strong);color:var(--muted);
    transition:all .15s;white-space:nowrap;
  }
  .lnk:hover{color:var(--ink);border-color:var(--ink);background:#FAFAF8}
  .lnk svg{flex:none}
  .lnk.primary{background:var(--dot);border-color:var(--dot);color:#fff}
  .lnk.primary:hover{filter:brightness(.92);background:var(--dot);border-color:var(--dot);color:#fff}

  footer{border-top:1px solid var(--hairline);padding:30px 0 50px}
  .foot{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
    font-size:13px;color:var(--faint)}
  .foot a{color:var(--muted);text-decoration:none;font-weight:500}
  .foot a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .foot-links{display:flex;flex-wrap:wrap;gap:18px}
  .empty{padding:50px 0 80px;color:var(--faint);font-size:15px}

  @media (max-width:640px){
    .hero{padding:26px 0 0}
    .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
    .tally{margin-left:0;width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
    .card:hover{transform:none}
  }
</style>

const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function card(p){
  const el = document.createElement('article');
  el.className = 'card';
  el.style.setProperty('--dot', p.accent);
  el.dataset.cats = p.cats.join(' ');

  const g = GLYPH[p.glyph] || GLYPH.braces;

  const links = [];
  if (p.app)  links.push(`<a class="lnk primary" href="${esc(p.app)}" target="_blank" rel="noopener noreferrer">${ICON.app}<span>Open app</span></a>`);
  if (p.page) links.push(`<a class="lnk" href="${esc(p.page)}" target="_blank" rel="noopener noreferrer">${ICON.page}<span>Project page</span></a>`);
  links.push(`<a class="lnk" href="${esc(p.repo)}" target="_blank" rel="noopener noreferrer">${ICON.repo}<span>Source</span></a>`);

  el.innerHTML = `
    <div class="shot${p.fit === 'contain' ? ' contain' : ''}">
      <div class="plate" aria-hidden="true">${g}</div>
      <img src="${esc(p.thumb)}" alt="Screenshot of ${esc(p.title)}" loading="lazy" decoding="async" />
    </div>
    <div class="body">
      <div class="titlerow">
        <span class="mark" aria-hidden="true">${g}</span>
        <h2>${esc(p.title)}</h2>
        ${p.private ? '<span class="badge" title="Source repository is private">Private</span>' : ''}
      </div>
      <p class="blurb">${esc(p.blurb)}</p>
      <div class="tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div>
    <div class="links">${links.join('')}</div>
  `;

  // Screenshots are optional — a missing one leaves the glyph plate showing.
  const img = el.querySelector('.shot img');
  img.addEventListener('error', () => img.remove(), { once:true });

  return el;
}

const grid = document.getElementById('grid');
PROJECTS.forEach(p => grid.appendChild(card(p)));

const liveApps = PROJECTS.filter(p => p.app).length;
const tally = document.getElementById('tally');
const summary = `${PROJECTS.length} projects · ${liveApps} live apps`;
tally.textContent = summary;

const chips = [...document.querySelectorAll('.chip')];
const empty = document.getElementById('empty');

chips.forEach(chip => chip.addEventListener('click', () => {
  const f = chip.dataset.filter;
  chips.forEach(c => c.setAttribute('aria-pressed', String(c === chip)));

  let shown = 0;
  [...grid.children].forEach(c => {
    const match = f === 'all' || c.dataset.cats.split(' ').includes(f);
    c.classList.toggle('is-hidden', !match);
    if (match) shown++;
  });
  empty.hidden = shown > 0;
  tally.textContent = f === 'all' ? summary : `${shown} shown`;
}));
</script>
